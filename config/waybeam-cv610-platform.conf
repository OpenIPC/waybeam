# CV610 platform prerequisites for init.d/S95waybeam.cv610.
WAYBEAM_ENABLED=1

# The verified 1080p100 mode needs the loader's 27 MHz sc4336p clock profile.
# Only the boot clock: with the sns0_clk_hz sys_config the daemon sets each
# mode's clock, and it takes the sensor itself from the u-boot env
# (fw_setenv sensor imx335).  Keep this a name the sys_config knows.
CV610_SENSOR_PROFILE=sc4336p

# MMZ for VB, ISP and VENC. The loader takes the allocator and the zone from
# /sys/module/hisi_mem/parameters when the kernel laid memory out itself --
# OpenIPC images whose kernel has hisi_mem (OpenIPC/firmware #2638, October
# 2026, and later) -- and these two are then ignored: they cannot move that
# zone; OpenIPC's set_allocator plus a reboot can. They apply only where
# hisi_mem is absent and the zone is a bootloader carve-out (defaults
# 0x44000000/64M, which on a 128 MiB board is all the RAM above a mem=64M
# kernel), and only when the command line does not name that carve-out
# itself with mmz= -- then CMA provides it and these two are ignored as well.
# Either way the loader says which values it dropped.
#
# On a boot without hisi_mem, growing the zone means a smaller kernel mem= and
# START and SIZE moved with it, never SIZE alone: past the end of RAM it is
# not a recoverable error. On any boot, a mode whose VB does not fit the zone
# fails vb init, and a /set that selects it takes the daemon down at the
# restart it triggers.
# Since 0.86.3 VB holds only the encoded-size output (IMX662 1080p30: 21 MiB
# in use, was 37); the IMX335's 2592-wide rows are not yet re-measured. See
# docs/CV610_BACKEND.md.
#CV610_MMZ_START=
#CV610_MMZ_SIZE=

# Load the ACODEC/AIO/AI/AENC modules when audio.enabled is true in
# /etc/waybeam.json. The default stays video-only.
CV610_AUDIO=0
